<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikSave - Design Prototypes Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f17; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Selector Bar -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-400 to-rose-500 flex items-center justify-center font-bold text-black text-sm">
        TK
      </div>
      <div>
        <h1 class="text-sm font-bold text-white leading-none">TikSave Design Prototypes</h1>
        <span class="text-[11px] text-slate-400 mono">Port 7755 · huashu-design preview</span>
      </div>
    </div>

    <!-- Direction Switcher Buttons -->
    <div class="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl text-xs font-semibold">
      <button onclick="switchTab('dir-1')" id="btn-dir-1" class="px-3.5 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition">
        Direction 1 (Minimalist Studio)
      </button>
      <button onclick="switchTab('dir-2')" id="btn-dir-2" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
        Direction 2 (Cyber Brutalist)
      </button>
      <button onclick="switchTab('dir-3')" id="btn-dir-3" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
        Direction 3 (Mobile Card)
      </button>
    </div>

    <!-- View Mode Switcher -->
    <div class="flex items-center gap-2 text-xs mono">
      <span class="text-slate-400">Viewport:</span>
      <button onclick="setViewport('100%')" id="btn-full" class="px-2 py-1 rounded bg-slate-800 text-white hover:bg-slate-700">Full</button>
      <button onclick="setViewport('420px')" id="btn-mobile" class="px-2 py-1 rounded bg-slate-900 text-slate-400 hover:text-white">Mobile</button>
      <a id="btn-direct-link" href="/dir-1.html" target="_blank" class="px-2 py-1 rounded bg-slate-900 text-cyan-400 hover:underline">Open Tab ↗</a>
    </div>
  </header>

  <!-- Prototype Frame Viewport -->
  <main class="flex-1 flex justify-center p-4 bg-[#07090e]">
    <div id="frame-container" class="w-full h-[85vh] transition-all duration-300 rounded-xl overflow-hidden border border-slate-800 shadow-2xl bg-black">
      <iframe id="preview-frame" src="/dir-1.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    function switchTab(dir) {
      document.getElementById('preview-frame').src = '/' + dir + '.html';
      document.getElementById('btn-direct-link').href = '/' + dir + '.html';
      
      const buttons = ['dir-1', 'dir-2', 'dir-3'];
      buttons.forEach(b => {
        const el = document.getElementById('btn-' + b);
        if (b === dir) {
          el.className = "px-3.5 py-1.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition";
        } else {
          el.className = "px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-white transition";
        }
      });
    }

    function setViewport(width) {
      const container = document.getElementById('frame-container');
      container.style.maxWidth = width;
      
      if (width === '100%') {
        document.getElementById('btn-full').className = "px-2 py-1 rounded bg-slate-800 text-white";
        document.getElementById('btn-mobile').className = "px-2 py-1 rounded bg-slate-900 text-slate-400 hover:text-white";
      } else {
        document.getElementById('btn-full').className = "px-2 py-1 rounded bg-slate-900 text-slate-400 hover:text-white";
        document.getElementById('btn-mobile').className = "px-2 py-1 rounded bg-slate-800 text-white";
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikSave - Direction 3: Mobile Native Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f1115; color: #f8fafc; }
    .glass-card {
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Mobile-centric Top Header -->
  <header class="max-w-md mx-auto w-full pt-8 px-5 pb-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#fe2c55] to-[#25f4ee] flex items-center justify-center shadow-lg shadow-rose-500/20">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-tight leading-none">TikSave Mobile</h1>
        <span class="text-[11px] text-slate-400">HD TikTok Downloader</span>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300">
      ⚡
    </div>
  </header>

  <!-- Card Center -->
  <main class="max-w-md mx-auto w-full px-5 py-4 flex-1 flex flex-col justify-center space-y-5">
    
    <!-- Input Card -->
    <div class="glass-card rounded-2xl p-4 shadow-xl">
      <label class="block text-xs font-medium text-slate-300 mb-2">Tempel Link Video</label>
      <div class="relative mb-3">
        <input 
          type="text" 
          placeholder="https://vt.tiktok.com/..." 
          class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 transition"
          value="https://www.tiktok.com/@tiktok/video/7106594312292453678"
        />
        <button class="absolute right-2.5 top-2.5 px-2.5 py-1 rounded-md bg-slate-800 text-[11px] text-slate-300 border border-slate-700 hover:bg-slate-700">
          Paste
        </button>
      </div>
      <button class="w-full py-3 rounded-xl bg-gradient-to-r from-[#fe2c55] to-[#ff0050] text-white font-semibold text-xs tracking-wide shadow-lg shadow-rose-600/30 active:scale-[0.98] transition">
        Ambil Video
      </button>
    </div>

    <!-- Ready Result Bottomsheet-like Card -->
    <div class="glass-card rounded-2xl p-4 shadow-xl border-t border-rose-500/20">
      <div class="flex gap-3 items-center mb-3">
        <div class="w-12 h-16 rounded-lg bg-slate-800 overflow-hidden relative shrink-0 border border-slate-700">
          <div class="absolute inset-0 bg-slate-700 animate-pulse"></div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-white truncate">Tips dan Trik Coding Santai 2026</p>
          <p class="text-[11px] text-slate-400">@pylexia · 1.5M views</p>
          <span class="inline-block mt-1 text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-medium">TikWM Verified</span>
        </div>
      </div>

      <div class="space-y-2 pt-2 border-t border-slate-800">
        <button class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-750 text-white font-medium text-xs flex items-center justify-between px-4 border border-slate-700/80">
          <span>Kualitas HD (1080p Original)</span>
          <span class="text-[10px] text-emerald-400">MP4</span>
        </button>
        <button class="w-full py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium text-xs flex items-center justify-between px-4 border border-slate-700/50">
          <span>Resolusi Normal (SD)</span>
          <span class="text-[10px] text-slate-400">MP4</span>
        </button>
        <button class="w-full py-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium text-xs flex items-center justify-between px-4 border border-slate-700/50">
          <span>Ekstrak Audio Saja</span>
          <span class="text-[10px] text-rose-400">MP3</span>
        </button>
      </div>
    </div>

  </main>

  <!-- Bottom Nav bar -->
  <nav class="max-w-md mx-auto w-full border-t border-slate-800/80 px-8 py-3 flex items-center justify-around text-slate-400 text-xs">
    <button class="text-rose-500 font-medium flex flex-col items-center gap-1">
      <span class="text-base">🏠</span>
      <span>Home</span>
    </button>
    <button class="hover:text-white flex flex-col items-center gap-1">
      <span class="text-base">⏱️</span>
      <span>Riwayat</span>
    </button>
    <button class="hover:text-white flex flex-col items-center gap-1">
      <span class="text-base">⚙️</span>
      <span>Info</span>
    </button>
  </nav>

</body>
</html>
